# Windows installer. Everything the app needs is bundled by electron-vite into out/,
# so no node_modules are shipped.
appId: com.neerav.posturecoach
productName: Posture Coach
copyright: Copyright © 2026 Neerav
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
win:
  target: nsis
  icon: build/icon.png
nsis:
  # Installs for the current user without an admin prompt, then launches.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  artifactName: Posture-Coach-Setup-${version}.${ext}
publish: null
